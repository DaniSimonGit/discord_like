<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Chat Local</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="ip-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #202225; z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
        <h2 style="color: white; margin-bottom: 20px;">Configuración del Servidor</h2>
        <p style="color: #b9bbbe; margin-bottom: 10px;">Introduce la IP del Host (ZeroTier):</p>
        <input type="text" id="ip-input" placeholder="Ej: 10.222.195.2" style="padding: 10px; width: 300px; margin-bottom: 20px; border-radius: 5px; border: none; outline: none;">
        <button onclick="guardarIP()" style="padding: 10px 20px; background: #5865F2; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Guardar y Reiniciar</button>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: #7289da; margin-bottom: 20px;">Bienvenido</h2>
            <form id="form-login">
                <input type="text" id="input-usuario" placeholder="Nombre de usuario..." required autocomplete="off"
                    autofocus>
                <button type="submit">Entrar al Servidor</button>
            </form>
        </div>
    </div>

    <div id="sidebar">
        <div class="titulo-app">Servidor Local</div>
        <button class="btn-sala activa" onclick="cambiarSala('General')"><span class="hash">#</span> General</button>
        <button class="btn-sala" onclick="cambiarSala('Juegos')"><span class="hash">#</span> Juegos</button>
        <button class="btn-sala" onclick="cambiarSala('Musica')"><span class="hash">#</span> Música</button>

        <div id="audio-controls"
        
            style="padding: 10px; background: #292b2f; display: flex; gap: 8px; align-items: center; margin-top: auto;">

            <button onclick="borrarIP()" title="Cambiar IP Servidor"
                style="width: 40px; background: #ed4245; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">
                🌐
            </button>
            <button id="btn-voz" onclick="toggleVoz()" title="Conectar Voz"
                style="flex: 1; background: #3ba55c; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                📞
            </button>

            <button id="btn-micro" onclick="toggleMicrofono()" title="Silenciar Micrófono"
                style="width: 40px; background: #2f3136; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">
                🎤
            </button>

            <button id="btn-audio" onclick="toggleAuriculares()" title="Ensordecer"
                style="width: 40px; background: #2f3136; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">
                🎧
            </button>

            <button onclick="abrirAjustes()" title="Ajustes"
                style="width: 40px; background: #2f3136; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">
                ⚙️
            </button>
        </div>
    </div>

    <div id="main-content">
        <div id="chat-area">
            <header>
                <span class="header-hash">#</span>
                <span id="titulo-sala">General</span>
            </header>
            <div id="mensajes"></div>
            <div class="input-area">
                <form id="form-mensaje">
                    <input type="text" id="input-texto" placeholder="Enviar mensaje..." autocomplete="off" />
                </form>
            </div>
        </div>

        <div id="users-sidebar">
            <div class="users-header">Conectados - <span id="contador-usuarios">0</span></div>
            <div id="lista-usuarios"></div>
        </div>
    </div>

    <div id="settings-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;">
        <div style="background: #36393f; padding: 30px; border-radius: 8px; width: 400px; color: white;">
            <h3>Ajustes de Voz</h3>

            <label style="display: block; margin-bottom: 5px; color: #b9bbbe;">Dispositivo de Entrada
                (Micrófono)</label>
            <select id="audio-input"
                style="width: 100%; padding: 8px; margin-bottom: 20px; background: #202225; color: white; border: none; border-radius: 4px;"></select>

            <label style="display: block; margin-bottom: 5px; color: #b9bbbe;">Dispositivo de Salida (Altavoces)</label>
            <select id="audio-output"
                style="width: 100%; padding: 8px; margin-bottom: 20px; background: #202225; color: white; border: none; border-radius: 4px;"></select>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="cerrarAjustes()"
                    style="padding: 8px 20px; background: #7289da; color: white; border: none; border-radius: 4px; cursor: pointer;">Guardar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // 1. GESTIÓN DE IP DINÁMICA
        let serverIP = localStorage.getItem('chatServerIP');
        let socket; // Lo declaramos con 'let' en vez de 'const'

        const ipModal = document.getElementById('ip-modal');
        const ipInput = document.getElementById('ip-input');

        if (!serverIP) {
            // Si no hay IP guardada, mostramos la ventana
            if (ipModal) ipModal.style.display = 'flex';
            
            // TRUCO: Creamos un "socket de mentira" para que los eventos de abajo
            // (socket.on, socket.emit) no den error de "undefined" mientras esperamos la IP.
            socket = { on: () => {}, emit: () => {}, connect: () => {} };
        } else {
            // Si ya hay IP, inicializamos el socket de verdad
            socket = io(`http://${serverIP}:3000`, { autoConnect: false });
        }

        // Función para guardar desde el botón de la ventana
        function guardarIP() {
            const ip = ipInput.value.trim();
            if (ip) {
                localStorage.setItem('chatServerIP', ip);
                location.reload(); // Recargamos para aplicar
            }
        }

        // Función para cambiar la IP después (Botón 🌐)
        function borrarIP() {
            if(confirm('¿Quieres cambiar la IP del servidor? La aplicación se reiniciará.')){
                localStorage.removeItem('chatServerIP');
                location.reload();
            }
        }

        // --- CÓDIGO ORIGINAL DEL CHAT ---
        let salaActual = 'General';
        let usuario = '';

        const loginScreen = document.getElementById('login-screen');
        const formLogin = document.getElementById('form-login');
        const inputUsuario = document.getElementById('input-usuario');

        // Login
        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            if (inputUsuario.value.trim()) {
                usuario = inputUsuario.value.trim();
                loginScreen.style.display = 'none';
                socket.connect();
                socket.emit('unirseSala', { sala: salaActual, nombre: usuario });
            }
        });

        // Cambiar Sala
        function cambiarSala(nuevaSala) {
            document.querySelectorAll('.btn-sala').forEach(btn => btn.classList.remove('activa'));
            const botones = document.querySelectorAll('.btn-sala');
            for (let btn of botones) {
                if (btn.innerText.includes(nuevaSala)) btn.classList.add('activa');
            }
            salaActual = nuevaSala;
            document.getElementById('titulo-sala').innerText = nuevaSala;
            document.getElementById('mensajes').innerHTML = '';
            socket.emit('unirseSala', { sala: nuevaSala, nombre: usuario });
        }

        // Enviar Mensaje
        const formMensaje = document.getElementById('form-mensaje');
        const inputTexto = document.getElementById('input-texto');

        formMensaje.addEventListener('submit', (e) => {
            e.preventDefault();
            if (inputTexto.value) {
                socket.emit('mensajeChat', { sala: salaActual, usuario: usuario, texto: inputTexto.value });
                inputTexto.value = '';
            }
        });

        // Pintar Mensajes
        function pintarMensaje(msg) {
            const div = document.createElement('div');
            div.className = 'mensaje';
            div.innerHTML = `
                <div class="mensaje-header">
                    <span class="autor">${msg.usuario}</span>
                    <span class="hora">${msg.hora || 'Ahora'}</span>
                </div>
                <div class="texto">${msg.texto}</div>
            `;
            const contenedor = document.getElementById('mensajes');
            contenedor.appendChild(div);
            contenedor.scrollTop = contenedor.scrollHeight;
        }

        // Eventos de Socket (Chat)
        socket.on('mensajeChat', (msg) => pintarMensaje(msg));
        socket.on('historialSala', (lista) => lista.forEach(msg => pintarMensaje(msg)));

        socket.on('actualizarUsuarios', (listaNombres) => {
            const contenedor = document.getElementById('lista-usuarios');
            document.getElementById('contador-usuarios').innerText = listaNombres.length;
            contenedor.innerHTML = '';
            listaNombres.forEach(nombre => {
                const item = document.createElement('div');
                item.className = 'usuario-item';

                //ID único para encontrar al usuario
                item.id = `user-${nombre}`;
                
                const inicial = nombre.charAt(0).toUpperCase();
                item.innerHTML = `
                    <div class="avatar-wrapper">
                        <div class="avatar-circle">${inicial}</div>
                        <div class="status-dot"></div>
                    </div>
                    <div class="nombre-usuario">${nombre}</div>
                `;
                contenedor.appendChild(item);
            });
        });
    </script>

    <script src="audio_script.js"></script>

</body>

</html>
